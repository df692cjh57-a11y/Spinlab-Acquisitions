kind = "web"
previewPath = "/"
title = "Spinlab Deal Desk"
version = "1.0.0"
id = "artifacts/spinlab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25092

[services.development]
run = "pnpm --filter @workspace/spinlab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spinlab", "run", "build" ]
publicDir = "artifacts/spinlab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25092"
BASE_PATH = "/"
