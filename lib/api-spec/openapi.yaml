        downPaymentPercent:
          type: ["number", "null"]
        interestRate:
          type: ["number", "null"]
        loanTermYears:
          type: ["number", "null"]
        amortizationYears:
          type: ["number", "null"]
        closingCostPercent:
          type: ["number", "null"]
        sbaFees:
          type: ["number", "null"]
        workingCapitalReserve:
          type: ["number", "null"]
        capexBudget:
          type: ["number", "null"]
        sellerFinancingAmount:
          type: ["number", "null"]
        sellerFinancingInterestRate:
          type: ["number", "null"]
        sellerFinancingAmortizationYears:
