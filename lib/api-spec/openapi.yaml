          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        assetType:
          type: string
        source:
          type: string
        brokerId:
          type: ["integer", "null"]
        sellerName:
          type: string
        askingPrice:
          type: ["number", "null"]
        grossRevenue:
          type: ["number", "null"]
        netIncome:
          type: ["number", "null"]
        adjustedNetIncome:
          type: ["number", "null"]
        monthlyRent:
          type: ["number", "null"]
        leaseYearsRemaining:
          type: ["number", "null"]
        renewalOptions:
          type: string
        squareFootage:
